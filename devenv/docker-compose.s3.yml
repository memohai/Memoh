name: "memoh-dev"

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    container_name: memoh-dev-seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: "${MEMOH_DEV_S3_ACCESS_KEY_ID:-memoh}"
      AWS_SECRET_ACCESS_KEY: "${MEMOH_DEV_S3_SECRET_ACCESS_KEY:-memoh-development}"
      S3_BUCKET: "${MEMOH_DEV_S3_BUCKET:-memoh-media}"
    volumes:
      - seaweedfs_data:/data
    ports:
      - "${MEMOH_DEV_S3_PORT:-18333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    environment:
      MEMOH_STORAGE_PROVIDER: s3
      MEMOH_STORAGE_S3_ENDPOINT: http://seaweedfs:8333
      MEMOH_STORAGE_S3_BUCKET: "${MEMOH_DEV_S3_BUCKET:-memoh-media}"
      MEMOH_STORAGE_S3_ACCESS_KEY_ID: "${MEMOH_DEV_S3_ACCESS_KEY_ID:-memoh}"
      MEMOH_STORAGE_S3_SECRET_ACCESS_KEY: "${MEMOH_DEV_S3_SECRET_ACCESS_KEY:-memoh-development}"
      MEMOH_STORAGE_S3_REGION: "${MEMOH_DEV_S3_REGION:-us-east-1}"
      MEMOH_STORAGE_S3_PREFIX: "${MEMOH_DEV_S3_PREFIX:-}"
      MEMOH_STORAGE_S3_BACKFILL_ON_START: "true"
    depends_on:
      seaweedfs:
        condition: service_healthy

  channel:
    environment:
      MEMOH_STORAGE_PROVIDER: s3
      MEMOH_STORAGE_S3_ENDPOINT: http://seaweedfs:8333
      MEMOH_STORAGE_S3_BUCKET: "${MEMOH_DEV_S3_BUCKET:-memoh-media}"
      MEMOH_STORAGE_S3_ACCESS_KEY_ID: "${MEMOH_DEV_S3_ACCESS_KEY_ID:-memoh}"
      MEMOH_STORAGE_S3_SECRET_ACCESS_KEY: "${MEMOH_DEV_S3_SECRET_ACCESS_KEY:-memoh-development}"
      MEMOH_STORAGE_S3_REGION: "${MEMOH_DEV_S3_REGION:-us-east-1}"
      MEMOH_STORAGE_S3_PREFIX: "${MEMOH_DEV_S3_PREFIX:-}"
    depends_on:
      seaweedfs:
        condition: service_healthy

volumes:
  seaweedfs_data:
    driver: local
